<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2b3847">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Site Survey">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<title>JE Site Survey</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: field form tool, sibling of the JE Stand Assessment. Sticky steel header with yellow rule; desktop gets a section rail, phones get a bottom tab bar and a sticky section switcher. Report is a paper document in ENG-SS-001 layout. */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#17202b; --muted:#5b6777; --line:#d3d9e0; --line-strong:#aab4c0;
  --steel:#2b3847; --steel-2:#33414f; --steel-line:#485767; --on-steel:#eef2f6; --on-steel-muted:#b9c3cf;
  --accent:#fcc23d; --accent-ink:#1a1400; --accent-soft:#fff4d6;
  --ok:#1f7a4d; --ok-soft:#e1f3e9; --bad:#b42318; --bad-soft:#fde7e5; --warn:#a15c00; --warn-soft:#fff0d6;
  --gray:#5b6777; --gray-soft:#e8ecf0; --focus:#1b6fd1; --scrim:rgba(10,14,20,.55);
  --pad-bg:#ffffff; --grid-minor:#dde4eb; --grid-major:#b9c5d1; --pen:#141a22;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f141a; --panel:#18202a; --ink:#e7ecf1; --muted:#9aa6b4; --line:#2a3440; --line-strong:#3b4756;
  --steel:#0a0f14; --steel-2:#18212b; --steel-line:#2c3846; --on-steel:#eef2f6; --on-steel-muted:#9aa6b4;
  --accent:#fcc23d; --accent-ink:#1a1400; --accent-soft:#3a2f0a;
  --ok:#4cc38a; --ok-soft:#123222; --bad:#ff7a6e; --bad-soft:#3b1714; --warn:#f0a840; --warn-soft:#3a2809;
  --gray:#a5b0bd; --gray-soft:#232c37; --focus:#6aa8ff; --scrim:rgba(0,0,0,.65);
  --pad-bg:#ffffff; --grid-minor:#dde4eb; --grid-major:#b9c5d1; --pen:#141a22; color-scheme:dark; }}
:root[data-theme="dark"]{
  --bg:#0f141a; --panel:#18202a; --ink:#e7ecf1; --muted:#9aa6b4; --line:#2a3440; --line-strong:#3b4756;
  --steel:#0a0f14; --steel-2:#18212b; --steel-line:#2c3846; --on-steel:#eef2f6; --on-steel-muted:#9aa6b4;
  --accent:#fcc23d; --accent-ink:#1a1400; --accent-soft:#3a2f0a;
  --ok:#4cc38a; --ok-soft:#123222; --bad:#ff7a6e; --bad-soft:#3b1714; --warn:#f0a840; --warn-soft:#3a2809;
  --gray:#a5b0bd; --gray-soft:#232c37; --focus:#6aa8ff; --scrim:rgba(0,0,0,.65);
  --pad-bg:#ffffff; --grid-minor:#dde4eb; --grid-major:#b9c5d1; --pen:#141a22; color-scheme:dark; }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-text-size-adjust:100%;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--steel)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;line-height:1.1;margin:0;text-wrap:balance}
.hint{font-size:13px;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--steel);color:var(--on-steel);border-bottom:4px solid var(--accent)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1400px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand-logo{height:34px;width:auto;flex:none;display:block}
.brand h1{font-size:22px;color:var(--on-steel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font:500 12px/1.2 var(--f-body);color:var(--on-steel-muted);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px}
.tab{background:transparent;border:1px solid var(--steel-line);color:var(--on-steel);padding:8px 14px;border-radius:6px;font-weight:600;min-height:40px}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab .ti{display:none}
.chip-sync{display:inline-flex;align-items:center;gap:6px;background:var(--steel-2);border:1px solid var(--steel-line);color:var(--on-steel);padding:6px 10px;border-radius:999px;font:600 13px/1 var(--f-body);white-space:nowrap}
.chip-sync i{width:8px;height:8px;border-radius:50%;background:var(--on-steel-muted);display:inline-block}
.chip-sync.ok i{background:#4cc38a}.chip-sync.busy i{background:var(--accent)}.chip-sync.off i{background:#ff7a6e}
.iconbtn{background:var(--steel-2);border:1px solid var(--steel-line);color:var(--on-steel);border-radius:6px;min-width:40px;min-height:40px;font-weight:700;font-size:18px;line-height:1}

/* layout */
.wrap{padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1400px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-h h2{font-size:26px}
.banner{background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{margin:0;flex:1;min-width:200px}
.banner.bad{background:var(--bad-soft);border-color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--panel);border:1px solid var(--line-strong);border-radius:8px;padding:10px 14px;font-weight:700;min-height:46px;text-align:center}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:default}
.linkbtn{background:none;border:0;color:var(--focus);font-weight:700;font-size:14px;padding:6px 0;min-height:36px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font:700 12px/1 var(--f-body);letter-spacing:.05em;text-transform:uppercase;border:1px solid transparent;white-space:nowrap}
.pill.green{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.pill.yellow{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.pill.red{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.pill.none{background:var(--gray-soft);color:var(--muted)}
.progress{height:6px;background:var(--gray-soft);border-radius:999px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);transition:width .2s}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:24px;margin-bottom:6px}
.empty p{max-width:48ch;margin:0 auto 14px}

/* survey list */
.slist{display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:14px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.srow:first-child{border-top:0}
.srow:hover{background:var(--accent-soft)}
.srow .t{font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis}
.srow .m{font-size:13.5px;color:var(--muted)}
.srow .progress{grid-column:1/-1;max-width:420px}
.srow .r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.srow .pc{font:500 12px var(--f-mono);color:var(--muted)}

/* survey layout */
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.shead h2{font-size:26px;min-width:0;overflow-wrap:anywhere}
.shead .m{font-size:14px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,64px) + 12px)}
.nav{display:flex;flex-direction:column;padding:6px 0}
.nitem{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 14px;border:0;background:none;text-align:left;width:100%;border-left:4px solid transparent}
.nitem[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent)}
.nitem .no{font:700 15px var(--f-mono);color:var(--muted)}
.nitem .nm{font-weight:700;font-size:15px;line-height:1.2}
.nitem .ct{font:500 12px var(--f-mono);color:var(--muted)}
.nitem .ct.done{color:var(--ok)}
.switch{display:none;grid-template-columns:46px minmax(0,1fr) 46px;gap:6px;align-items:center;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,64px));z-index:20;background:var(--bg);padding-block:8px;margin-top:-8px}
.switch select{min-height:46px;border:1px solid var(--line-strong);border-radius:8px;background:var(--panel);padding:0 10px;font-weight:700;width:100%;font-size:16px;min-width:0}
.switch .nv{min-height:46px;border:1px solid var(--line-strong);border-radius:8px;background:var(--panel);font-size:20px;font-weight:700}
.sect{padding:18px}
.sect-h{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:16px;flex-wrap:wrap}
.sect-h .sn{font:700 13px/1 var(--f-mono);background:var(--ink);color:var(--panel);padding:5px 7px;border-radius:4px;letter-spacing:.04em}
.sect-h h3{font-size:24px;flex:1;min-width:0}
.sect-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}

/* fields */
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.wide,.fhead{grid-column:1/-1}
.fhead{font:700 18px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding-top:8px;border-top:1px solid var(--line);margin-top:4px}
.fhead:first-child{border-top:0;padding-top:0;margin-top:0}
.field>label,.field>.lbl{font-size:14px;font-weight:700;color:var(--ink)}
.field input,.field select,.field textarea,.inp{background:var(--bg);border:1px solid var(--line-strong);border-radius:8px;padding:10px;min-height:46px;width:100%;font-size:16px;min-width:0}
.field textarea{min-height:90px;resize:vertical}
.field textarea.big{min-height:150px}
.gpsrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;max-width:100%}
.seg button{border:0;border-right:1px solid var(--line);background:var(--panel);min-height:44px;font-weight:800;font-size:15px;padding:0 14px;min-width:0}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.seg button[aria-pressed="true"][data-v="Y"],.seg button[aria-pressed="true"][data-v="G"],.seg button[aria-pressed="true"][data-v="Ready"],.seg button[aria-pressed="true"][data-v="L"]{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"][data-v="F"],.seg button[aria-pressed="true"][data-v="Conditional"],.seg button[aria-pressed="true"][data-v="M"]{background:var(--warn);color:#fff}
.seg button[aria-pressed="true"][data-v="P"],.seg button[aria-pressed="true"][data-v="Not Ready"],.seg button[aria-pressed="true"][data-v="H"]{background:var(--bad);color:#fff}
.yn{display:flex;flex-direction:column;gap:6px}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chk{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line-strong);background:var(--bg);border-radius:8px;padding:10px 12px;min-height:46px;font-weight:600;font-size:15px;min-width:0}
.chk .bx{width:22px;height:22px;border:2px solid var(--line-strong);border-radius:4px;flex:none;display:grid;place-items:center;font-size:15px;font-weight:900;line-height:1;background:var(--panel)}
.chk[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chk[aria-checked="true"] .bx{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chk[aria-checked="true"] .bx::before{content:"✓"}
.chk.none{border-style:dashed}
.table{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.trow{display:grid;grid-template-columns:minmax(160px,1.1fr) auto minmax(0,1.4fr);gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);background:var(--panel)}
.trow:first-child{border-top:0}
.trow.th{background:var(--gray-soft);font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.trow .nm{font-weight:700;font-size:15px;min-width:0}
.trow .seg button{padding:0 10px;min-width:44px}
.mrow{display:grid;grid-template-columns:minmax(150px,1fr) minmax(0,.8fr) minmax(0,1.2fr) auto;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);background:var(--panel)}
.mrow:first-child{border-top:0}
.mrow .dim{font-family:var(--f-mono)}
.xbtn{border:1px solid var(--line-strong);background:var(--panel);border-radius:8px;min-width:44px;min-height:44px;color:var(--bad);font-weight:800;font-size:18px}
.xph{min-width:44px}

/* sketches, photos */
.sketches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.skcard{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);display:flex;flex-direction:column;min-width:0}
.skprev{position:relative;aspect-ratio:17/11;max-width:100%;background-color:var(--pad-bg);background-image:linear-gradient(var(--grid-minor) 1px,transparent 1px),linear-gradient(90deg,var(--grid-minor) 1px,transparent 1px);background-size:2.941% 4.545%;border:0;padding:0;width:100%;display:block}
.skprev img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.skprev .ov{position:absolute;inset:auto 0 0 0;padding:8px;font-weight:700;font-size:14px;color:#17202b;background:rgba(255,255,255,.82)}
.skfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.photo{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;min-width:0}
.photo img,.photo .ph{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--gray-soft)}
.photo .ph{display:grid;place-items:center;font-size:13px;color:var(--muted);padding:8px;text-align:center}
.photo input{border:0;border-top:1px solid var(--line);padding:8px;background:var(--panel);font-size:15px;width:100%}
.photo .pf{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);background:var(--panel);padding:0 8px}
.photo .pf small{color:var(--muted);font-size:12px;font-family:var(--f-mono)}
.photo .pf button{border:0;background:none;color:var(--bad);padding:8px 0;font-size:14px;font-weight:700;min-height:40px}

/* issues */
.issue{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;background:var(--panel);position:relative}
.issue .ih{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px}
.issue .ih b{font:700 20px var(--f-display)}
.issue .full{grid-column:1/-1}

/* signatures */
.sigs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sig{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--panel);min-width:0}
.sig h4{margin:0;font:700 17px var(--f-display);letter-spacing:.02em}
.sigbox{height:110px;border:1px dashed var(--line-strong);border-radius:8px;background:var(--pad-bg);display:grid;place-items:center;color:#5b6777;font-weight:700;width:100%;padding:4px}
.sigbox img{max-height:100%;max-width:100%}
.sig .two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:8px}

/* sketch pad overlay */
.padwrap{position:fixed;inset:0;z-index:80;background:var(--steel);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.padbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 10px;color:var(--on-steel)}
.padbar .ttl{font:700 18px var(--f-display);margin-right:auto;white-space:nowrap}
.tool{background:var(--steel-2);border:1px solid var(--steel-line);color:var(--on-steel);border-radius:8px;min-height:42px;min-width:42px;padding:0 10px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.tool[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tool .sw{width:16px;height:16px;border-radius:50%;border:2px solid #fff;display:inline-block}
.tool.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tgroup{display:inline-flex;gap:4px;padding-right:6px;border-right:1px solid var(--steel-line)}
.tgroup:last-of-type{border-right:0}
.padstage{flex:1;display:grid;place-items:center;padding:6px 10px 10px;min-height:0;position:relative}
.padstage canvas{background-color:var(--pad-bg);background-image:linear-gradient(var(--grid-major) 1px,transparent 1px),linear-gradient(90deg,var(--grid-major) 1px,transparent 1px),linear-gradient(var(--grid-minor) 1px,transparent 1px),linear-gradient(90deg,var(--grid-minor) 1px,transparent 1px);background-size:14.706% 22.727%,14.706% 22.727%,2.941% 4.545%,2.941% 4.545%;touch-action:none;border-radius:4px;max-width:100%;max-height:100%;display:block;cursor:crosshair}
.txtpop{position:absolute;z-index:3;display:flex;gap:6px;background:var(--panel);padding:6px;border-radius:8px;border:1px solid var(--line-strong);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.txtpop input{min-height:40px;border:1px solid var(--line-strong);border-radius:6px;padding:6px 8px;font-size:16px;width:200px;background:var(--bg)}
.padtip{display:none;color:var(--on-steel);background:var(--steel-2);border:1px solid var(--steel-line);border-radius:8px;margin:0 10px;padding:8px 12px;font-size:14px;font-weight:600}
@media (orientation:portrait) and (max-width:760px){.padtip{display:block}}
.sigpad canvas{width:100%;height:auto;aspect-ratio:3/1;background:var(--pad-bg);border:1px solid var(--line-strong);border-radius:8px;touch-action:none;display:block}

/* report */
.report-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.report-scroll{overflow-x:auto}
.precheck{border:1px solid var(--warn);background:var(--warn-soft);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.precheck.ok{border-color:var(--ok);background:var(--ok-soft)}
.precheck h3{font-size:19px;margin-bottom:6px}
.precheck ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:2px}
.report{background:#fff;color:#141a22;max-width:8.5in;margin:0 auto;padding:clamp(18px,5vw,.6in);border:1px solid var(--line);border-radius:4px;font-size:9.5pt;line-height:1.4;font-family:var(--f-body)}
.report .rhead{display:grid;grid-template-columns:auto 1fr auto;gap:14pt;align-items:center;border:1.5pt solid #141a22;padding:10pt 12pt;background:#2b3847;color:#fff}
.report .rhead img{height:40pt;width:auto}
.report .rhead h1{font:700 22pt/1 var(--f-display);color:#fff;letter-spacing:.03em}
.report .rhead .sub{font-size:9.5pt;color:#d5dde6;margin-top:3pt}
.report .rhead .doc{font:500 8.5pt/1.4 var(--f-mono);text-align:right;color:#fff}
.report .ybar{height:5pt;background:#fcc23d;margin-bottom:10pt}
.report h2{font:700 12pt/1.1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;margin:14pt 0 6pt;padding:4pt 7pt;background:#e7ebf0;border-left:5pt solid #fcc23d;color:#141a22}
.report h3{font:700 10.5pt/1.2 var(--f-display);letter-spacing:.04em;text-transform:uppercase;margin:8pt 0 4pt;color:#141a22}
.report p{margin:0 0 6pt}
.report table{width:100%;border-collapse:collapse;margin:0 0 6pt;font-size:9pt;table-layout:fixed}
.report th,.report td{border:.75pt solid #9aa5b1;padding:4pt 6pt;text-align:left;vertical-align:top;overflow-wrap:anywhere}
.report th{background:#eef1f4;font-weight:700}
.report .kv td{width:50%}
.report .kv .k{display:block;font-weight:700;font-size:8pt;color:#3d4753}
.report .kv .v{display:block;min-height:11pt;white-space:pre-wrap}
.report .kv .wide{width:100%}
.report .blank{color:#8a94a0}
.report .cbx{display:grid;grid-template-columns:1fr 1fr;gap:2pt 12pt;border:.75pt solid #9aa5b1;padding:5pt 8pt;margin-bottom:6pt}
.report .cb{font-size:9pt}
.report .cb b{font-family:var(--f-mono);font-weight:500;margin-right:4pt}
.report .rate{font-family:var(--f-mono);white-space:nowrap}
.report .rate .on{font-weight:700;color:#141a22;background:#fcc23d;padding:0 2pt}
.report .rate .off{color:#8a94a0}
.report .note{border:.75pt solid #9aa5b1;padding:5pt 7pt;min-height:28pt;white-space:pre-wrap;margin-bottom:6pt}
.report .note .k{display:block;font-weight:700;font-size:8pt;color:#3d4753;margin-bottom:2pt}
.report .sk{border:.75pt solid #9aa5b1}
.report .sk img{display:block;width:100%}
.report .skcap{font-size:8.5pt;color:#3d4753;margin:3pt 0 0}
.report .rphotos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8pt}
.report .rphotos figure{margin:0}
.report .rphotos img{width:100%;aspect-ratio:4/3;object-fit:cover;border:.75pt solid #9aa5b1;display:block}
.report .rphotos figcaption{font-size:8.5pt;color:#3d4753;margin-top:2pt}
.report .sigt td{height:auto}
.report .sigimg{height:42pt;display:flex;align-items:flex-end;border-bottom:.75pt solid #141a22;margin-bottom:3pt}
.report .sigimg img{max-height:40pt;max-width:100%}
.report .ctrl th,.report .ctrl td{text-align:center;font-family:var(--f-mono);font-size:8.5pt}
.report .small{font-size:8pt;color:#4b5563}
.report.pdfmode{width:7.5in;max-width:none;padding:0;border:0;border-radius:0}
#pdf-host{position:fixed;left:-10000px;top:0;width:7.5in;background:#fff}

/* modal, sheet, toast */
.modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:90;padding:16px}
.modal .box{background:var(--panel);border-radius:12px;padding:20px;max-width:460px;width:100%;border:1px solid var(--line)}
.modal .box.wide{max-width:720px}
.modal .box p{margin:8px 0 16px}
.sheet{position:fixed;inset:0;background:var(--scrim);z-index:85;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--panel);border-radius:14px 14px 0 0;width:100%;max-width:520px;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
.sheet .btn{width:100%;justify-content:flex-start}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:8px;z-index:95;font-weight:600;max-width:calc(100% - 32px);text-align:center}

@media (max-width:1100px){ .brand small{display:none} }
@media (max-width:900px){
  .grid2{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .switch{display:grid}
}
@media (max-width:760px){
  .brand h1{font-size:20px}
  .brand-logo{height:28px}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:35;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:var(--steel);border-top:1px solid var(--steel-line);padding-block:6px calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .tab{min-height:52px;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px}
  .tab .ti{display:block;font-size:12px;font-weight:500;opacity:.85}
  .wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .fields,.checks,.sketches,.sigs{grid-template-columns:minmax(0,1fr)}
  .sect{padding:14px}
  .trow{grid-template-columns:minmax(0,1fr) auto}
  .trow .nt{grid-column:1/-1}
  .trow.th{display:none}
  .mrow{grid-template-columns:minmax(0,1fr) auto}
  .mrow .lab{grid-column:1/-1}
  .mrow .mn{grid-column:1/2}
  .mrow.fixed{grid-template-columns:minmax(0,1fr)}
  .mrow.fixed .xph{display:none}
  .issue{grid-template-columns:minmax(0,1fr)}
  .seg{width:100%}
  .sig .two{grid-template-columns:minmax(0,1fr)}
  .shead h2{font-size:22px}
  .padbar .ttl{display:none}
}
@media (max-width:380px){ .chip-sync b{display:none} }
@media (pointer:coarse){ .tab{min-height:46px} .btn.sm{min-height:42px} .linkbtn{min-height:44px;padding:8px 0} }
@media (max-width:760px){ body.typing .tabs{display:none} body.typing .wrap{padding-bottom:32px} body.typing .toast{bottom:16px} }
@media print{
  @page{size:letter;margin:.5in}
  body{background:#fff} body::before{display:none}
  .top,.noprint,.view:not(#v-report),.tabs,.padwrap{display:none!important}
  .wrap{padding:0;max-width:none}
  .report{border:0;padding:0;max-width:none;border-radius:0}
  .report-scroll{overflow:visible}
  .report .pb{break-before:page}
  tr,figure,.keep{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- utilities ---------- */
const $ = id => document.getElementById(id);
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function clone(o){return JSON.parse(JSON.stringify(o??null))}
function nl(s){return esc(s).replace(/\n/g,"<br>")}
function today(){const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function nowTime(){const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function fmtDate(s){if(!s)return"";const m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?`${+m[2]}/${+m[3]}/${m[1]}`:s}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}

/* ---------- image store: IndexedDB with memory fallback ---------- */
const IDB=(()=>{let p=null;function open(){if(p)return p;p=new Promise((res,rej)=>{try{const r=indexedDB.open("je-site-survey",1);r.onupgradeneeded=()=>r.result.createObjectStore("imgs");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return p}
 function tx(mode,fn){return open().then(d=>new Promise((res,rej)=>{const t=d.transaction("imgs",mode);const r=fn(t.objectStore("imgs"));t.oncomplete=()=>res(r?r.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}))}
 return {get:k=>tx("readonly",s=>s.get(k)),put:(k,v)=>tx("readwrite",s=>s.put(v,k)),del:k=>tx("readwrite",s=>s.delete(k))}})();
const MEM=new Map(), URLS=new Map(), LOADING=new Set();
async function putImg(blob){const lid="l"+uid();MEM.set(lid,blob);try{await IDB.put(lid,blob)}catch(e){}return {lid}}
async function blobOf(img){
  if(!img) return null;
  if(img.lid){ if(MEM.has(img.lid)) return MEM.get(img.lid); try{const b=await IDB.get(img.lid); if(b){MEM.set(img.lid,b);return b}}catch(e){} }
  if(img.id){ try{const r=await fetch("/_blob/"+img.id); if(r.ok) return await r.blob()}catch(e){} }
  return null;
}
function srcOf(img){
  if(!img) return "";
  if(img.lid){ if(URLS.has(img.lid)) return URLS.get(img.lid);
    if(!LOADING.has(img.lid)){ LOADING.add(img.lid); blobOf({lid:img.lid}).then(b=>{ if(b){URLS.set(img.lid,URL.createObjectURL(b)); softRender()} }); }
    if(!img.id) return "";
  }
  if(img.id) return "/_blob/"+img.id;
  return "";
}
function dropImg(img){ if(!img) return; if(img.id) S.trash.push(img.id); if(img.lid){ MEM.delete(img.lid); IDB.del(img.lid).catch(()=>{}); } }
function eachImg(sec,p,fn){
  if(!p) return;
  if(sec==="s8"){ (p.sketch||[]).forEach(im=>{if(im)fn(im)}); (p.photos||[]).forEach(ph=>{if(ph&&ph.img)fn(ph.img)}); }
  if(sec==="s10"){ for(const k of Object.keys(p.sig||{})){ const s=p.sig[k]; if(s&&s.img) fn(s.img); } }
}

/* ---------- state ---------- */
// S.list[sid] = {head, created, updated}; S.parts[sid][sec] = section data
let S = {list:{}, parts:{}, cur:null, sec:"s1", trash:[]};
let dirty = new Map();
let mode = "local";
const inViewer = !!(window.claude && typeof window.claude.use === "function");
let db=null, assets=null, downloads=null;
let view="list";
let reachable=false, loadTimedOut=false, failCount=0, readOnly=false, flushing=false;

const curL = () => S.cur ? S.list[S.cur] : null;
const partsOf = sid => S.parts[sid] || (S.parts[sid] = {});
function part(sec, sid=S.cur){ const p=partsOf(sid); return p[sec] || (p[sec] = {}); }

let cacheT=null;
function saveCache(){clearTimeout(cacheT);cacheT=setTimeout(()=>{ if(!lsSet(CACHE_KEY,JSON.stringify({list:S.list,parts:S.parts,cur:S.cur,sec:S.sec,trash:S.trash,dirty:[...dirty]}))) toast("This device's storage is full. Let it sync, or save a survey file.") },250)}
function loadCache(){ try{const c=JSON.parse(lsGet(CACHE_KEY)||"null"); if(c&&c.list){S.list=c.list;S.parts=c.parts||{};S.cur=c.cur||null;S.sec=c.sec||"s1";S.trash=c.trash||[];dirty=new Map(c.dirty||[]);return true}}catch(e){} return false }

/* ---------- persistence ---------- */
const hPath = sid => `surveys/${sid}`;
const pPath = (sid,sec) => `surveys/${sid}/parts/${sec}`;
function mark(path,op="set"){ if(mode!=="db"){saveCache();return} const d=dirty.get(path); dirty.set(path,{op,seq:(d?d.seq:0)+1}); saveCache(); scheduleFlush(); renderSync() }
function touchPart(sec, sid=S.cur){
  mark(pPath(sid,sec));
  const l=S.list[sid]; if(!l) return;
  const h=headOf(sid);
  if(JSON.stringify(h)!==JSON.stringify(l.head)){ l.head=h; l.updated=Date.now(); mark(hPath(sid)); }
}
function headOf(sid){
  const p=partsOf(sid), a=p.s1||{}, z=p.s10||{};
  return {proj:a.projName||"",num:a.projNum||"",client:a.client||"",date:a.date||"",surveyor:a.surveyor||"",ready:z.ready||"",pct:progress(sid).pct};
}
let flushT=null;
function scheduleFlush(ms=700){ if(mode!=="db"||!db||readOnly) return; clearTimeout(flushT); flushT=setTimeout(flush,ms) }
async function flush(){
  if(mode!=="db"||!db||flushing||readOnly) return;
  flushing=true; renderSync();
  try{
    for(const [path,d] of [...dirty]){
      const seq=d.seq;
      try{
        if(d.op==="delete") await db.doc(path).delete();
        else { const body=await bodyFor(path); if(body===null){dirty.delete(path);continue} await db.doc(path).set(body); }
        const now=dirty.get(path); if(now&&now.seq===seq) dirty.delete(path);
        failCount=0; reachable=true;
      }catch(e){ onWriteError(e); break; }
    }
    if(!dirty.size && assets && S.trash.length){ const t=S.trash.splice(0); for(const id of t) assets.delete(id).catch(()=>{}); }
  } finally {
    flushing=false; saveCache(); renderSync();
    if(dirty.size&&!readOnly) scheduleFlush(failCount?Math.min(60000,4000*failCount):400);
  }
}
function onWriteError(e){
  const c=e&&e.code;
  if(c==="invalid_argument"||c==="not_granted"||c==="revoked"){readOnly=true;renderBanners();return}
  if(c==="quota_exceeded") toast("Storage for this tool is full. Delete old surveys to free space.");
  failCount++;
}
async function bodyFor(path){
  const p=path.split("/");
  if(p.length===2){ const l=S.list[p[1]]; if(!l) return null; return {head:l.head||{},created:l.created||Date.now(),updated:l.updated||Date.now()} }
  const sid=p[1], sec=p[3]; const d=(S.parts[sid]||{})[sec]; if(!d) return null;
  if(assets){ const imgs=[]; eachImg(sec,d,im=>imgs.push(im)); for(const im of imgs){ if(im.lid&&!im.id){ const b=await blobOf(im); if(!b){continue} const r=await assets.upload(b,{type:b.type||"image/png"}); im.id=r.id; const old=im.lid; delete im.lid; if(URLS.has(old)){ /* keep local preview */ } IDB.del(old).catch(()=>{}); saveCache(); } } }
  const o=clone(d); eachImg(sec,o,im=>{ if(!im.id) im.pending=true; delete im.lid; });
  return o;
}

/* ---------- live sync ---------- */
let unsubList=null, unsubParts=null, subSid=null, loadTimer=null;
function startSync(){
  loadTimer=setTimeout(()=>{if(!reachable){loadTimedOut=true;renderSync();renderBanners()}},10000);
  unsubList=db.collection("surveys").onSnapshot(snap=>{
    let changed=false; const seen=new Set();
    for(const d of snap.docs){
      seen.add(d.id); if(dirty.has(hPath(d.id))) continue;
      const inc=clone(d.data()); const loc=S.list[d.id];
      if(!loc||JSON.stringify(loc)!==JSON.stringify(inc)){S.list[d.id]=inc;changed=true}
    }
    if(!snap.metadata.fromCache){
      if(!reachable) changed=true;
      reachable=true; loadTimedOut=false; clearTimeout(loadTimer);
      for(const id of Object.keys(S.list)) if(!seen.has(id)&&!dirty.has(hPath(id))){delete S.list[id];delete S.parts[id];changed=true}
    }
    if(S.cur&&!S.list[S.cur]){S.cur=null;if(view!=="list")view="list";changed=true}
    if(changed){saveCache();subscribeParts();softRender()}
    renderSync(); renderBanners();
  }, err=>{ if(err&&err.code==="revoked") readOnly=true; renderSync(); renderBanners(); });
  subscribeParts();
}
function subscribeParts(){
  if(mode!=="db"||subSid===S.cur) return;
  if(unsubParts){unsubParts();unsubParts=null}
  subSid=S.cur; if(!S.cur) return;
  const sid=S.cur;
  unsubParts=db.collection(`surveys/${sid}/parts`).onSnapshot(snap=>{
    const local=partsOf(sid); let changed=false;
    for(const d of snap.docs){
      if(dirty.has(pPath(sid,d.id))) continue;
      const inc=clone(d.data());
      // keep any local preview of images this device uploaded
      if(JSON.stringify(local[d.id])!==JSON.stringify(inc)){local[d.id]=inc;changed=true}
    }
    if(changed){saveCache();softRender()}
  }, ()=>{});
}

let pendingRender=false;
function softRender(){
  const ae=document.activeElement;
  if(ae&&$("main").contains(ae)&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)){ if(!pendingRender){pendingRender=true; ae.addEventListener("blur",()=>{pendingRender=false;setTimeout(render,0)},{once:true})} return; }
  if($("pad-root").firstChild) { pendingRender=true; return; }
  render();
}

/* ---------- progress ---------- */
function filled(it,v){
  switch(it.type){
    case "yn": return !!(v&&v.v);
    case "checks": return Array.isArray(v)&&v.length>0;
    case "rating": return 0; // counted per row
    case "measure": return !!((v||[]).some(r=>r&&r.d) || (part("s7")?.custom||[]).some(r=>r&&r.d));
    case "sketches": return !!(v||[]).some(Boolean);
    case "issues": return !!((v||[]).some(r=>r&&r.desc) || part("s9").none);
    case "sigs": return !!(v&&v.surveyor&&v.surveyor.img);
    default: return !!(v&&String(v).trim());
  }
}
function secProgress(sec,sid=S.cur){
  const s=SEC[sec], p=(partsOf(sid)[sec])||{}; let done=0,total=0;
  for(const it of s.items){
    if(it.type==="head"||it.opt) continue;
    if(it.type==="rating"){ const arr=p[it.k]||[]; it.rows.forEach((_,i)=>{total++; if(arr[i]&&arr[i].r) done++}); continue; }
    total++;
    const v = it.type==="measure" ? p.rows : p[it.k];
    if(it.type==="measure"){ if(((p.rows||[]).some(r=>r&&r.d))||((p.custom||[]).some(r=>r&&r.d))) done++; continue; }
    if(it.type==="issues"){ if(((p.items||[]).some(r=>r&&r.desc))||p.none) done++; continue; }
    if(filled(it,v)) done++;
  }
  return {done,total};
}
function progress(sid=S.cur){ let d=0,t=0; const per={}; for(const s of SECTIONS){const r=secProgress(s.k,sid);per[s.k]=r;d+=r.done;t+=r.total} return {done:d,total:t,pct:t?Math.round(d/t*100):0,per} }

/* ---------- rendering: shell ---------- */
function show(v){ view=v; try{sessionStorage.setItem("je-ss-ui",JSON.stringify({view,sec:S.sec}))}catch(e){} render(); window.scrollTo(0,0); }
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{ const v=b.dataset.view; if(v!=="list"&&!curL()){ toast("Open or start a survey first"); show("list"); return } show(v) });
function render(){
  pendingRender=false;
  if(view!=="list"&&!curL()) view="list";
  for(const v of ["list","form","report"]){ $("v-"+v).hidden = v!==view; $("t-"+v).setAttribute("aria-selected", v===view ? "true":"false"); }
  renderBanners(); renderSync();
  if(view==="list") renderList();
  if(view==="form") renderForm();
  if(view==="report") renderReport();
}
function renderSync(){
  const el=$("sync"); let cls="", txt="On this device";
  if(mode==="db"){
    if(readOnly){cls="off";txt="View only"}
    else if(!reachable){cls=loadTimedOut?"off":"busy";txt=loadTimedOut?"Offline":"Connecting"}
    else if(dirty.size||flushing){cls="busy";txt="Saving"}
    else {cls="ok";txt="Synced"}
  }
  el.className="chip-sync "+cls; el.innerHTML=`<i></i><b>${txt}</b>`;
  el.title = mode==="db" ? "Surveys sync to everyone using this link" : "Surveys are saved in this browser on this device";
}
function renderBanners(){
  const b=[];
  if(mode==="db"&&readOnly) b.push(`<div class="banner bad"><p><b>View only.</b> You can read surveys here but your changes won't be saved to the shared list. Ask the owner for edit access, or save a survey file from the menu.</p></div>`);
  if(mode==="db"&&loadTimedOut&&!readOnly) b.push(`<div class="banner"><p><b>No connection.</b> Keep working. Changes stay on this device and upload when the signal comes back.</p></div>`);
  if(inViewer&&mode==="local") b.push(`<div class="banner"><p>Shared surveys aren't available in this view, so surveys are saved in this browser only. Use <b>Save survey file</b> in the menu to send one to the office.</p></div>`);
  $("banners").innerHTML=b.join(""); $("banners").hidden=!b.length;
}

/* ---------- survey list ---------- */
function readyPill(r){ if(r==="Ready")return`<span class="pill green">Ready</span>`; if(r==="Conditional")return`<span class="pill yellow">Conditional</span>`; if(r==="Not Ready")return`<span class="pill red">Not ready</span>`; return`<span class="pill none">Open</span>` }
function sortedIds(){ return Object.keys(S.list).sort((a,b)=>(S.list[b].updated||0)-(S.list[a].updated||0)) }
function renderList(){
  const ids=sortedIds(); const V=$("v-list");
  const loading = mode==="db" && !reachable && !loadTimedOut && !ids.length;
  let body;
  if(loading) body=`<div class="empty"><h3>Loading surveys…</h3><p>Getting the shared survey list.</p></div>`;
  else if(!ids.length) body=`<div class="empty"><h3>No site surveys yet</h3><p>Start one when you arrive on site. Work through the ten sections of form ENG-SS-001, sketch the area, add photos and signatures, then download the PDF.</p><div class="row" style="justify-content:center"><button class="btn primary" type="button" data-a="new">Start a site survey</button>${mode==="local"?`<button class="btn" type="button" data-a="example">See an example</button>`:""}</div></div>`;
  else body=`<div class="slist">${ids.map(id=>{const h=S.list[id].head||{};const pct=h.pct||0;
    return `<button class="srow" type="button" data-open="${esc(id)}"><div style="min-width:0"><div class="t">${esc(h.proj||"Untitled survey")}</div><div class="m">${esc([h.client,h.num?"#"+h.num:"",fmtDate(h.date),h.surveyor].filter(Boolean).join(" · ")||"No details yet")}</div></div><div class="r">${readyPill(h.ready)}<span class="pc">${pct}% complete</span></div><div class="progress"><span style="width:${pct}%"></span></div></button>`}).join("")}</div>`;
  V.innerHTML=`<div class="sec-h" style="margin-bottom:14px"><div><h2>Site surveys</h2><div class="hint">${mode==="db"?"Shared with everyone who uses this link. Newest first.":"Saved in this browser on this device. Newest first."}</div></div>${ids.length?`<button class="btn primary" type="button" data-a="new">New survey</button>`:""}</div><div class="panel">${body}</div>`;
  V.querySelectorAll("[data-a=new]").forEach(b=>b.onclick=newSurvey);
  V.querySelectorAll("[data-a=example]").forEach(b=>b.onclick=()=>{importBackup(exampleSurvey(),true).then(()=>show("form"))});
  V.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openSurvey(b.dataset.open));
}
function newSurvey(){
  if(mode==="db"&&readOnly){toast("You have view-only access to the shared list");return}
  const sid=uid(); const me=JSON.parse(lsGet("je-ss-me")||"{}");
  S.list[sid]={head:{},created:Date.now(),updated:Date.now()};
  S.parts[sid]={s1:{date:today(),time:nowTime(),surveyor:me.name||"",role:me.role||""}};
  S.list[sid].head=headOf(sid);
  mark(hPath(sid)); mark(pPath(sid,"s1"));
  S.cur=sid; S.sec="s1"; subscribeParts(); show("form");
}
function openSurvey(sid){ S.cur=sid; S.sec="s1"; saveCache(); subscribeParts(); show("form"); }

/* ---------- survey form ---------- */
function attrs(sec,key,i,sub){ return `data-sec="${sec}" data-key="${key}"${i!=null?` data-i="${i}"`:""}${sub?` data-sub="${sub}"`:""}` }
function fid(sec,key,i,sub){ return ["f",sec,key,i,sub].filter(x=>x!=null&&x!=="").join("-") }
function segHTML(sec,key,opts,val,i,sub,label){
  return `<div class="seg" role="group" aria-label="${esc(label||"")}">${opts.map(o=>`<button type="button" ${attrs(sec,key,i,sub)} data-v="${esc(o[0])}" aria-pressed="${val===o[0]}"${o[2]?` title="${esc(o[2])}"`:""}>${esc(o[1])}</button>`).join("")}</div>`;
}

      ${!arr.length?`<div class="empty" style="padding:18px"><p style="margin:0 auto">No issues logged yet. Add each issue, risk or action item you find on site.</p></div>`:""}
      <div class="row"><button class="btn primary" type="button" data-act="addissue">+ Add issue or action item</button><button type="button" class="chk none" role="checkbox" aria-checked="${!!p.none}" data-act="noissues" style="flex:0 1 auto"><span class="bx"></span><span>No issues found</span></button></div></div></div>`; }
    case "sigs": { const sg=v||{}; return `<div class="field wide"><span class="lbl" style="margin-top:6px">Signatures &amp; approval</span><div class="sigs">${SIGS.map(([k,l])=>{const o=sg[k]||{};const src=srcOf(o.img);return `<div class="sig"><h4>${esc(l)}</h4><button type="button" class="sigbox" data-act="sign" data-k="${k}" aria-label="Sign: ${esc(l)}">${src?`<img src="${esc(src)}" alt="Signature">`:(o.img&&o.img.pending?"Signature uploading from another device":"Tap to sign")}</button><div class="two"><div class="field"><label for="${fid(sec,"sig",null,k+"n")}">Print Name</label><input id="${fid(sec,"sig",null,k+"n")}" data-sig="${k}" data-sf="name" value="${esc(o.name||"")}"></div><div class="field"><label for="${fid(sec,"sig",null,k+"d")}">Date</label><input type="date" id="${fid(sec,"sig",null,k+"d")}" data-sig="${k}" data-sf="date" value="${esc(o.date||"")}"></div></div>${o.img?`<button class="linkbtn" type="button" data-act="unsign" data-k="${k}" style="align-self:flex-start;color:var(--bad)">Clear signature</button>`:""}</div>`}).join("")}</div></div>`; }

}
function renderForm(){

  const navItem=x=>{const r=pr.per[x.k];return `<button class="nitem" type="button" data-sec-go="${x.k}" aria-current="${x.k===s.k}"><span class="no">${x.n}</span><span class="nm">${esc(x.t)}</span><span class="ct${r.total&&r.done===r.total?" done":""}" data-ct="${x.k}">${r.total&&r.done===r.total?"✓":`${r.done}/${r.total}`}</span></button>`};
  V.innerHTML=`<div class="shead"><div style="min-width:0;flex:1"><h2 id="s-title">${esc(h.proj||"Untitled survey")}</h2><div class="m" id="s-meta">${esc([h.client,h.num?"Project #"+h.num:"",fmtDate(h.date)].filter(Boolean).join(" · ")||"Fill in Section 1 to name this survey")}</div><div class="row" style="margin-top:8px;max-width:420px;flex-wrap:nowrap"><div class="progress" style="flex:1"><span id="s-bar" style="width:${pr.pct}%"></span></div><span class="hint mono" id="s-pct">${pr.pct}%</span></div></div><div class="row"><button class="btn sm" type="button" data-act="toreport">Review report</button><button class="btn sm danger" type="button" data-act="delsurvey">Delete</button></div></div>
  <div class="switch"><button class="nv" type="button" data-sec-go="${prev?prev.k:""}" aria-label="Previous section"${prev?"":" disabled"}>‹</button><select id="sec-sel" aria-label="Section">${SECTIONS.map(x=>{const r=pr.per[x.k];return `<option value="${x.k}"${x.k===s.k?" selected":""}>${x.n}. ${esc(x.t)} (${r.done}/${r.total})</option>`}).join("")}</select><button class="nv" type="button" data-sec-go="${next?next.k:""}" aria-label="Next section"${next?"":" disabled"}>›</button></div>
  <div class="grid2"><aside class="rail panel"><nav class="nav" aria-label="Sections">${SECTIONS.map(navItem).join("")}</nav></aside>
  <div class="panel sect" id="sect"><div class="sect-h"><span class="sn">SECTION ${s.n}</span><h3>${esc(s.t)}</h3></div><div class="fields">${s.items.map(it=>itemHTML(s.k,it,p)).join("")}</div>
  <div class="sect-foot">${prev?`<button class="btn" type="button" data-sec-go="${prev.k}">‹ ${esc(prev.t)}</button>`:"<span></span>"}${next?`<button class="btn primary" type="button" data-sec-go="${next.k}">Next: ${esc(next.t)} ›</button>`:`<button class="btn primary" type="button" data-act="toreport">Review report and download PDF ›</button>`}</div></div></div>`;
  V.querySelectorAll("[data-sec-go]").forEach(b=>b.onclick=()=>{if(!b.dataset.secGo)return;goSec(b.dataset.secGo)});
  $("sec-sel").onchange=e=>goSec(e.target.value);
}
function goSec(k){ S.sec=k; saveCache(); try{sessionStorage.setItem("je-ss-ui",JSON.stringify({view,sec:S.sec}))}catch(e){} renderForm(); const y=$("v-form").getBoundingClientRect().top+window.scrollY-((parseInt(getComputedStyle(document.documentElement).getPropertyValue("--hdr"))||64)+8); window.scrollTo(0,Math.max(0,y)); }
function refreshProgress(){
  const pr=progress(); const b=$("s-bar"); if(!b) return;
  b.style.width=pr.pct+"%"; $("s-pct").textContent=pr.pct+"%";
  for(const s of SECTIONS){ const el=document.querySelector(`[data-ct="${s.k}"]`); const r=pr.per[s.k]; if(el){ const d=r.total&&r.done===r.total; el.textContent=d?"✓":`${r.done}/${r.total}`; el.classList.toggle("done",d) } }
  const sel=$("sec-sel"); if(sel) [...sel.options].forEach((o,i)=>{const s=SECTIONS[i];const r=pr.per[s.k];o.textContent=`${s.n}. ${s.t} (${r.done}/${r.total})`});
  const h=curL().head||{}; $("s-title").textContent=h.proj||"Untitled survey";
  $("s-meta").textContent=[h.client,h.num?"Project #"+h.num:"",fmtDate(h.date)].filter(Boolean).join(" · ")||"Fill in Section 1 to name this survey";
}

/* field value plumbing */
function tgt(el){
  const {sec,key,i,sub}=el.dataset; const o=part(sec);
  if(i!=null&&i!==""){ if(!Array.isArray(o[key])) o[key]=[]; const arr=o[key]; for(let j=0;j<=+i;j++) if(!arr[j]||typeof arr[j]!=="object") arr[j]=arr[j]||{}; return [arr[+i],sub]; }
  if(sub){ if(!o[key]||typeof o[key]!=="object") o[key]={}; return [o[key],sub]; }
  return [o,key];
}
function getV(el){const [t,f]=tgt(el);return t[f]}
function setV(el,v){const [t,f]=tgt(el);t[f]=v;afterChange(el.dataset.sec)}
function afterChange(sec){ touchPart(sec); refreshProgress(); if(sec==="s1"){ const p=part("s1"); if(p.surveyor||p.role) lsSet("je-ss-me",JSON.stringify({name:p.surveyor||"",role:p.role||""})); } }

$("v-form").addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.sig){ const sg=part("s10").sig||(part("s10").sig={}); const o=sg[el.dataset.sig]||(sg[el.dataset.sig]={}); o[el.dataset.sf]=el.value; afterChange("s10"); return; }
  if(el.dataset.sec&&el.dataset.key) setV(el,el.value);
});
$("v-form").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.v!=null&&b.dataset.sec){ const cur=getV(b); const nv=cur===b.dataset.v?"":b.dataset.v; setV(b,nv); b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.v===nv&&nv!==""))); return; }
  if(b.dataset.chk!=null&&b.dataset.sec){ const p=part(b.dataset.sec); let arr=Array.isArray(p[b.dataset.key])?p[b.dataset.key]:[]; const v=b.dataset.chk;
    if(arr.includes(v)) arr=arr.filter(x=>x!==v); else arr = v===NONE ? [NONE] : [...arr.filter(x=>x!==NONE),v];
    p[b.dataset.key]=arr; b.parentElement.querySelectorAll(".chk").forEach(x=>x.setAttribute("aria-checked",String(arr.includes(x.dataset.chk)))); afterChange(b.dataset.sec); return; }
  const a=b.dataset.act; if(!a) return;
  const sec=S.sec;
  if(a==="toreport") show("report");
  if(a==="delsurvey") delSurvey();
  if(a==="gps") getGps();
  if(a==="addmeas"){ const p=part("s7"); (p.custom=p.custom||[]).push({l:"",d:"",n:""}); afterChange("s7"); renderForm(); const i=p.custom.length-1; setTimeout(()=>{const el=$(fid("s7","custom",i,"l")); if(el) el.focus()},0) }
  if(a==="delmeas"){ const p=part("s7"); p.custom.splice(+b.dataset.i,1); afterChange("s7"); renderForm() }
  if(a==="addissue"){ const p=part("s9"); (p.items=p.items||[]).push({desc:"",pri:"",act:"",resp:"",date:""}); p.none=false; afterChange("s9"); renderForm(); const i=p.items.length-1; setTimeout(()=>{const el=$(fid("s9","items",i,"desc")); if(el){el.focus();el.scrollIntoView({block:"center"})}},0) }
  if(a==="delissue"){ confirmBox(`Remove item ${+b.dataset.i+1}?`,"Its description, priority and action are removed from this survey.","Remove",()=>{ const p=part("s9"); p.items.splice(+b.dataset.i,1); afterChange("s9"); renderForm() }) }
  if(a==="noissues"){ const p=part("s9"); p.none=!p.none; b.setAttribute("aria-checked",String(p.none)); afterChange("s9") }
  if(a==="cam") $("f-cam").click();
  if(a==="pics") $("f-pics").click();
  if(a==="delphoto"){ confirmBox("Remove this photo?","It is removed from this survey"+(mode==="db"?" on every device.":"."),"Remove",()=>{ const p=part("s8"); const ph=p.photos.splice(+b.dataset.i,1)[0]; if(ph) dropImg(ph.img); afterChange("s8"); renderForm() }) }
  if(a==="sketch") openPad(+b.dataset.i);
  if(a==="clrsketch"){ confirmBox(`Remove sketch page ${+b.dataset.i+1}?`,"The drawing is deleted from this survey.","Remove",()=>{ const p=part("s8"); p.sketch=p.sketch||[]; dropImg(p.sketch[+b.dataset.i]); p.sketch[+b.dataset.i]=null; afterChange("s8"); renderForm() }) }
  if(a==="sign") openSig(b.dataset.k);
  if(a==="unsign"){ const sg=part("s10").sig||{}; const o=sg[b.dataset.k]; if(o){ dropImg(o.img); delete o.img; } afterChange("s10"); renderForm() }
});
function getGps(){
  const el=$(fid("s1","gps"));
  if(!navigator.geolocation){ toast("Location isn't available here. Type the coordinates instead."); return }
  toast("Getting your location…");
  navigator.geolocation.getCurrentPosition(pos=>{ const v=`${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`; if(el){el.value=v;setV(el,v)} toast("Location added") },
    ()=>toast("Location isn't available here. Type the coordinates instead, for example from your phone's map app."),{enableHighAccuracy:true,timeout:12000});
}
function delSurvey(){
  const l=curL(); if(!l) return;
  confirmBox(`Delete "${l.head.proj||"Untitled survey"}"?`, mode==="db"?"The survey, its sketches, photos and signatures are removed for everyone using this link. This can't be undone.":"The survey, its sketches, photos and signatures are removed from this device. This can't be undone.","Delete survey",()=>{
    const sid=S.cur; const parts=partsOf(sid);
    for(const sec of Object.keys(parts)){ eachImg(sec,parts[sec],im=>dropImg(im)); mark(pPath(sid,sec),"delete"); }
    if(mode==="db") for(const s of SECTIONS) if(!parts[s.k]) mark(pPath(sid,s.k),"delete");
    mark(hPath(sid),"delete"); delete S.list[sid]; delete S.parts[sid]; S.cur=null; saveCache(); show("list"); toast("Survey deleted");
  });
}

/* ---------- photos ---------- */
async function resizeImage(file,max=1600,q=0.82){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*sc); c.height=Math.round(img.naturalHeight*sc);
    const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,"image/jpeg",q));
  } finally { URL.revokeObjectURL(url) }
}
async function addPhotos(files){
  if(!files||!files.length||!curL()) return;
  const p=part("s8"); p.photos=p.photos||[]; let n=0;
  for(const f of files){ if(!/^image\//.test(f.type)) continue; try{ const b=await resizeImage(f); if(!b) continue; const im=await putImg(b); URLS.set(im.lid,URL.createObjectURL(b)); p.photos.push({img:im,cap:""}); n++; }catch(e){ toast("One photo couldn't be read. Try a JPEG or PNG.") } }
  if(n){ afterChange("s8"); renderForm(); toast(n===1?"Photo added":`${n} photos added`) }
}
$("f-cam").addEventListener("change",e=>{addPhotos([...e.target.files]);e.target.value=""});
$("f-pics").addEventListener("change",e=>{addPhotos([...e.target.files]);e.target.value=""});

    const blob=await new Promise(r=>c.toBlob(r,"image/png"));
    const p10=part("s10"); const sg=p10.sig||(p10.sig={}); const o=sg[k]||(sg[k]={});

function precheck(sid){
  const P=partsOf(sid), s1=P.s1||{}, s10=P.s10||{}, iss=[];
  const need=(ok,txt,sec)=>{ if(!ok) iss.push(`<li><button class="linkbtn" type="button" data-fix="${sec}">${txt}</button></li>`) };
  need(s1.projName,"Add the project name (Section 1)","s1"); need(s1.client,"Add the client / customer (Section 1)","s1");
  need(s1.address,"Add the site address (Section 1)","s1"); need(s1.surveyor,"Add the surveyor name (Section 1)","s1");
  need(s10.ready,"Choose the site readiness (Section 10)","s10"); need(s10.sig&&s10.sig.surveyor&&s10.sig.surveyor.img,"Surveyor signature (Section 10)","s10");
  const pr=progress(sid);
  for(const s of SECTIONS){ const r=pr.per[s.k]; if(r.total&&r.done<r.total&&!["s1","s10"].includes(s.k)) iss.push(`<li><button class="linkbtn" type="button" data-fix="${s.k}">Section ${s.n}, ${esc(s.t)}: ${r.done} of ${r.total} answered</button></li>`) }
  if(!iss.length) return `<div class="precheck ok noprint"><h3>Ready to send</h3><p class="hint" style="margin:0">Every section is answered and the surveyor has signed.</p></div>`;
  return `<div class="precheck noprint"><h3>Before you send</h3><ul style="list-style:none;padding:0">${iss.join("")}</ul><p class="hint" style="margin:6px 0 0">You can still download the PDF. Blank answers print as a dash.</p></div>`;
}

/* ---------- PDF ---------- */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>{s.remove();rej(new Error("load"))};document.head.appendChild(s)})}
async function ensurePdfLib(){ if(window.html2pdf) return; for(const u of PDF_SRC){ try{await loadScript(u); if(window.html2pdf) return}catch(e){} } throw new Error("lib") }
function fileSafe(s){return String(s||"").replace(/[^a-z0-9]+/gi,"-").replace(/^-+|-+$/g,"")}
function saveLocal(blob,name){ const l=document.createElement("a"); l.href=URL.createObjectURL(blob); l.download=name; document.body.appendChild(l); l.click(); setTimeout(()=>{URL.revokeObjectURL(l.href);l.remove()},1500) }
let pdfBusy=false;
async function makePdf(){
  if(pdfBusy) return; const l=curL(); if(!l) return;
  pdfBusy=true; const btn=$("b-pdf"); const lbl=btn.textContent; btn.disabled=true; btn.textContent="Building PDF…";
  try{
    await ensurePdfLib();
    const sid=S.cur, R=await resolveImages(sid);
    const host=$("pdf-host"); host.innerHTML=`<article class="report pdfmode">${reportHTML(sid,R)}</article>`;
    await Promise.all([...host.querySelectorAll("img")].map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r})));
    const h=l.head||{}; const name=`JE-Site-Survey-${fileSafe(h.proj||"survey")}-${h.date||today()}.pdf`.replace(/-+/g,"-");
    const worker=window.html2pdf().set({margin:[0.55,0.5,0.6,0.5],image:{type:"jpeg",quality:0.92},html2canvas:{scale:Math.min(2,Math.max(1.5,window.devicePixelRatio||1)),useCORS:true,backgroundColor:"#ffffff"},jsPDF:{unit:"in",format:"letter",orientation:"portrait"},pagebreak:{mode:["css","legacy"],before:".pb",avoid:["tr",".keep","figure",".note",".cbx"]}}).from(host.firstElementChild).toPdf();
    const pdf=await worker.get("pdf"); const n=pdf.internal.getNumberOfPages();
    for(let i=1;i<=n;i++){ pdf.setPage(i); pdf.setFont("helvetica","normal"); pdf.setFontSize(7.5); pdf.setTextColor(80,90,100);
      pdf.text("FIELD SITE SURVEY FORM",0.5,0.35); pdf.text(`Doc #: ${FORM.num} | Rev: ${FORM.rev}`,8,0.35,{align:"right"});
      pdf.setDrawColor(252,194,61); pdf.setLineWidth(0.02); pdf.line(0.5,0.42,8,0.42);
      pdf.text("CONFIDENTIAL - INTERNAL USE ONLY",0.5,10.65); pdf.text(`Page ${i} of ${n}`,4.25,10.65,{align:"center"}); pdf.text(`Form ${FORM.num} | Rev ${FORM.rev}`,8,10.65,{align:"right"}); }
    const blob=pdf.output("blob"); host.innerHTML="";
    if(inViewer){ await downloads.save({filename:name,data:blob}); } else saveLocal(blob,name);
    toast("PDF saved");
  }catch(e){
    const c=e&&e.code;
    if(c==="declined"){} else if(c==="rate_limited") toast("A save prompt is already open.");
    else if(e&&e.message==="lib"){ if(!inViewer){ toast("No internet for the PDF builder. Use Print and choose Save as PDF."); setTimeout(()=>window.print(),600) } else toast("Couldn't load the PDF builder. Check your connection and try again."); }
    else toast("Couldn't build the PDF. Try again, or save a survey file and build it on a computer.");
  }finally{ pdfBusy=false; if($("b-pdf")){btn.disabled=false; btn.textContent=lbl;} $("pdf-host").innerHTML=""; }
}

/* ---------- survey file (backup / send to office) ---------- */
async function blobToData(b){return await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=()=>r(null);fr.readAsDataURL(b)})}
async function exportBackup(){
  const l=curL(); if(!l){toast("Open a survey first");return}
  toast("Preparing survey file…");
  const parts=clone(partsOf(S.cur));
  for(const sec of Object.keys(parts)){ const imgs=[]; eachImg(sec,parts[sec],im=>imgs.push(im)); for(const im of imgs){ const b=await blobOf(im); if(b) im.data=await blobToData(b); delete im.lid; delete im.id; delete im.pending; } }
  const out=JSON.stringify({kind:"je-site-survey",form:FORM.num,rev:FORM.rev,version:1,exported:new Date().toISOString(),head:l.head,parts});
  const h=l.head||{}; const nm=`je-site-survey-${fileSafe(h.proj||"survey").toLowerCase()}-${h.date||"undated"}.json`;
  if(inViewer){ if(!downloads){toast("Saving files isn't available in this view");return} try{await downloads.save({filename:nm,data:out});toast("Survey file saved")}catch(e){if(e&&e.code!=="declined")toast("Couldn't save the survey file")} }
  else { try{ saveLocal(new Blob([out],{type:"application/json"}),nm); toast("Survey file saved. Email it to the office.") }catch(e){ toast("Couldn't save the survey file") } }
}
async function importBackup(d,quiet){
  if(!d||d.kind!=="je-site-survey"||!d.parts) throw new Error("bad");
  const sid=uid(); const parts={};
  for(const sec of Object.keys(d.parts)){ if(!SEC[sec]) continue; const p=clone(d.parts[sec]); const imgs=[]; eachImg(sec,p,im=>imgs.push(im));
    for(const im of imgs){ if(im.data){ try{ const b=await (await fetch(im.data)).blob(); const n=await putImg(b); im.lid=n.lid; }catch(e){} } delete im.data; delete im.id; delete im.pending; }
    if(sec==="s8"){ p.sketch=(p.sketch||[]).map(im=>im&&im.lid?im:null); p.photos=(p.photos||[]).filter(ph=>ph&&ph.img&&ph.img.lid); }
    if(sec==="s10"&&p.sig){ for(const k of Object.keys(p.sig)) if(p.sig[k]&&p.sig[k].img&&!p.sig[k].img.lid) delete p.sig[k].img; }
    parts[sec]=p; }
  S.parts[sid]=parts; S.list[sid]={head:{},created:Date.now(),updated:Date.now()}; S.list[sid].head=headOf(sid);
  mark(hPath(sid)); for(const sec of Object.keys(parts)) mark(pPath(sid,sec));
  S.cur=sid; S.sec="s1"; saveCache(); subscribeParts();
  if(!quiet){ show("form"); toast("Survey file opened as a new survey"); }
}
$("f-import").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=async()=>{try{await importBackup(JSON.parse(rd.result))}catch(err){toast("That file isn't a JE site survey file")}};rd.readAsText(f);e.target.value=""});

    s10:{summary:"Example only. Site is suitable once the drain trench conflict is resolved.",ready:"Conditional",follow:"Yes"}
  }};
}

/* ---------- menu, modal, toast, wake lock ---------- */
$("b-menu").onclick=()=>{
  const root=$("modal-root"); const has=!!curL();
  root.innerHTML=`<div class="sheet" id="sheet"><div class="box" role="dialog" aria-modal="true" aria-label="More options">
    <button class="btn" type="button" data-m="new">New survey</button>
    ${has?`<button class="btn" type="button" data-m="bk">Save survey file${inViewer?"":" (to email to the office)"}</button>`:""}
    <button class="btn" type="button" data-m="imp">Open a survey file</button>
    <button class="btn" type="button" data-m="wake">${wake?"Let screen sleep":"Keep screen on during the survey"}</button>
    <p class="hint" style="margin:4px 2px">${mode==="db"?"Surveys sync to everyone who uses this link. Work done without signal stays on this device and uploads later.":"Surveys are saved in this browser on this device. Save a survey file to send one to the office or open it on another device."} Form ${FORM.num} Rev ${FORM.rev}.</p>
    <button class="btn" type="button" data-m="close" style="justify-content:center">Close</button></div></div>`;
  const close=()=>root.innerHTML="";
  $("sheet").onclick=e=>{if(e.target.id==="sheet")close()};
  root.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{const m=b.dataset.m;close();if(m==="new")newSurvey();if(m==="bk")exportBackup();if(m==="imp")$("f-import").click();if(m==="wake")toggleWake()});
};
function confirmBox(title,msg,okLabel,onOk){
  const root=$("modal-root");
  const wrap=document.createElement("div"); wrap.className="modal"; wrap.setAttribute("role","dialog"); wrap.setAttribute("aria-modal","true"); wrap.style.zIndex="99";
  wrap.innerHTML=`<div class="box"><h3 style="font-size:22px">${esc(title)}</h3><p>${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="btn" type="button" data-c="no">Cancel</button><button class="btn primary" type="button" data-c="ok">${esc(okLabel)}</button></div></div>`;
  root.appendChild(wrap);
  const close=()=>wrap.remove(); wrap.querySelector("[data-c=no]").onclick=close; const ok=wrap.querySelector("[data-c=ok]"); ok.onclick=()=>{close();onOk()}; ok.focus();
}
let toastT;function toast(t){let el=document.querySelector(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}el.textContent=t;clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),3000)}
let wake=null, wakeWanted=false;
async function requestWake(){ if(!wakeWanted||wake||!navigator.wakeLock) return; try{wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>{wake=null})}catch(e){wake=null} }
async function toggleWake(){ if(wake){wakeWanted=false;try{await wake.release()}catch(e){}wake=null;toast("Screen can sleep");return} wakeWanted=true; await requestWake(); toast(wake?"Screen stays on while this page is open":"This device won't keep the screen on from here") }
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){requestWake();if(mode==="db"){failCount=0;scheduleFlush(200)}}});
function kbCheck(){const ae=document.activeElement;const inp=!!(ae&&/^(INPUT|TEXTAREA)$/.test(ae.tagName)&&!/^(file|checkbox|radio|button)$/.test(ae.type||""));const vv=window.visualViewport;const shrunk=vv?vv.height<window.innerHeight*0.8:inp;document.body.classList.toggle("typing",inp&&shrunk)}
document.addEventListener("focusin",()=>setTimeout(kbCheck,250));
document.addEventListener("focusout",()=>setTimeout(kbCheck,150));
if(window.visualViewport) window.visualViewport.addEventListener("resize",kbCheck);
function setHdr(){document.documentElement.style.setProperty("--hdr",$("top").offsetHeight+"px")}
try{new ResizeObserver(setHdr).observe($("top"))}catch(e){window.addEventListener("resize",setHdr)}
setHdr();

/* ---------- boot ---------- */
(function boot(){
  const had=loadCache();
  try{const u=JSON.parse(sessionStorage.getItem("je-ss-ui")||"null");if(u){view=u.view||"list";if(u.sec)S.sec=u.sec}}catch(e){}
  if(!inViewer){ mode="local"; dirty.clear(); saveCache(); render(); return; }
  mode="db"; render();
  (async()=>{
    try{ db = await window.claude.use("db"); }catch(e){ db=null }
    if(!db){ mode="local"; dirty.clear(); saveCache(); render(); return; }
    try{ assets = await window.claude.use("assets"); }catch(e){ assets=null }
    try{ downloads = await window.claude.use("downloads"); }catch(e){ downloads=null }
    startSync(); scheduleFlush(200); render();
  })();
})();
